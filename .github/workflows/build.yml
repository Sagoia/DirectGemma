name: build

on:
  push:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build native MSVC solution
        run: msbuild msvc\gemma\gemma.slnx /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma-windows-msvc-release
          path: |
            msvc/gemma/build/x64/Release/*.exe
            msvc/gemma/build/x64/Release/*.lib
