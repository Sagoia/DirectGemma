name: build

on:
  push:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize]
  workflow_dispatch:

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore vcpkg dependencies
        shell: pwsh
        run: .\msvc\gemma\restore-vcpkg.ps1 -VcpkgRoot C:\vcpkg

      - name: Build native MSVC solution
        run: msbuild msvc\gemma\gemma.slnx /t:Build /p:Configuration=Release /p:Platform=x64 /m

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma-windows-msvc-release
          path: |
            msvc/gemma/build/x64/Release/*.exe
            msvc/gemma/build/x64/Release/*.lib
